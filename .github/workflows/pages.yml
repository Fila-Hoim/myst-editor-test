# Builds the book (and the MyST editor at <site>/editor/, from editor-dist/) and publishes it on GitHub
# Pages. Needs Pages switched on once: Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The site lives at https://<owner>.github.io/<repository>/
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The page-last-updated plugin reads each page's history.
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install MyST
        run: npm install -g mystmd
      - name: Build the book and the editor
        run: myst build --html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
